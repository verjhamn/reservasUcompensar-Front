  - _id: req_graph_me_select_department
    parentId: fld_graph_me_department
    modified: 1786566929000
    created: 1786566929000
    url: "{{ _.graph_base_url }}/v1.0/me"
    name: "GET /me - validar department"
    description: "Obtiene el perfil autenticado desde Microsoft Graph incluyendo el nuevo campo department. Antes de Fetch Tokens, configurar client_secret con el VALOR del secreto de Azure, no con el ID. Si aparece AADSTS50146 antes de recibir token, revisar claims customizados o signing key en la aplicacion de Entra ID."
    method: GET
    body: {}
    parameters:
      - id: pair_select_me_department
        name: "$select"
        value: "businessPhones,displayName,givenName,jobTitle,mail,mobilePhone,officeLocation,preferredLanguage,surname,userPrincipalName,id,department"
        description: "Campos esperados en la respuesta de /me."
        disabled: false
    headers:
      - id: pair_accept_json
        name: Accept
        value: application/json
        description: ""
        disabled: false
    authentication:
      type: oauth2
      grantType: authorization_code
      authorizationUrl: "{{ _.login_base_url }}/{{ _.tenant_id }}/oauth2/v2.0/authorize"
      accessTokenUrl: "{{ _.login_base_url }}/{{ _.tenant_id }}/oauth2/v2.0/token"
      clientId: "{{ _.client_id }}"
      clientSecret: "{{ _.client_secret }}"
      scope: "{{ _.graph_scope }}"
      redirectUrl: "{{ _.redirect_uri }}"
      credentialsInBody: true
      usePkce: true
      disabled: false
    metaSortKey: -1786566929000
